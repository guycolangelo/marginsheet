# The gates (M0 plan Task 0.4, extended 15 Aug 2026). These block; branch
# protection on main requires them by job name. Isolation runs here too but is
# not yet required.
#
# db-identity BLOCKS, deliberately (ruled 15 Aug 2026). It was landed as a
# check that ran and gated nothing, which is the same shape as the isolation
# suite's blind spot: a control that observes without gating is a report, and
# reports are what let three compounding failures hide for ten merged PRs.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: fancy-paper-35797264

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @marginsheet/api --filter @marginsheet/conversation --filter @marginsheet/fact-packages test

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @marginsheet/conversation test:golden

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @marginsheet/lint test

  # Does each Worker hold exactly the secrets it is permitted to hold?
  #
  # The removal half of M4 section 2a's key move gets its own proof. A key on
  # the sync Worker AND still on api is not a boundary, and NOTHING FAILS when
  # that happens: every sync test passes either way. This is the only control
  # that goes red on an un-removed key.
  #
  # It fails on a difference in either direction AND on a Worker it could not
  # read, which are different answers that look identical from a green tick.
  #
  # EXPECTED RED until task 4.2.4 moves TOKEN_ENCRYPTION_KEY off api. That is
  # deliberate: the check landed BEFORE the change so it could not be written to
  # agree with whatever was done.
  secret-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare declared secrets against the live Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/scripts/verify-worker-secrets.mjs

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migrate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create or reuse the PR's Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          CS=$(scripts/neon-pr-branch.sh create ${{ github.event.pull_request.number }})
          echo "::add-mask::$CS"
          echo "PR_DATABASE_URL=$CS" >> "$GITHUB_ENV"
      # Up, verify by introspection, down, then up again. The second up
      # proves the down left the branch in a state the migrations can be
      # replayed onto: a down that "succeeds" but strands an enum or a
      # function is a down that fails the next deploy, not this job.
      - name: Migrations up
        env:
          DATABASE_URL: ${{ env.PR_DATABASE_URL }}
        run: pnpm --filter @marginsheet/schema migrate:up

      - name: Verify the schema by introspecting the branch
        env:
          DATABASE_URL: ${{ env.PR_DATABASE_URL }}
        run: pnpm --filter @marginsheet/schema test:introspection

      - name: Migrations down
        env:
          DATABASE_URL: ${{ env.PR_DATABASE_URL }}
        run: pnpm --filter @marginsheet/schema migrate:down

      - name: Migrations up again, proving down is replayable
        env:
          DATABASE_URL: ${{ env.PR_DATABASE_URL }}
        run: pnpm --filter @marginsheet/schema migrate:up

      # Better Auth against a real database as marginsheet_app, the role the
      # application actually uses. Proving it works as the OWNER would prove
      # nothing: the owner holds BYPASSRLS and every privilege.
      #
      # This step rotates marginsheet_app's password, which is why it runs
      # HERE and nowhere else. The PR branch is ephemeral and
      # neon-pr-cleanup.yml destroys it.
      #
      # NEON_TEST_BRANCH names the TARGET, and the helper refuses to rotate
      # anything that is not pr-<n>. It replaced AUTH_ADAPTER_TEST_MAY_ROTATE_
      # ROLE, which granted permission to rotate without ever naming a place:
      # on 16 Aug 2026 that flag was set by hand against the shared dev branch
      # and dev's Workers lost their database until the secret was reissued.
      # The warning that used to sit here said exactly that, and stopped
      # nothing, because a comment is documentation and not a control.
      #
      # Derived from the same PR number that built the branch, so the
      # declaration and the connection string cannot drift apart.
      - name: Better Auth runs as the RLS-subject application role
        env:
          DATABASE_URL: ${{ env.PR_DATABASE_URL }}
          NEON_TEST_BRANCH: pr-${{ github.event.pull_request.number }}
        run: pnpm --filter @marginsheet/api test:auth-adapter

  isolation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [dev, staging]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Derive branch connection and hosts
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          CS=$(pnpm exec neonctl connection-string ${{ matrix.target }} --project-id "$NEON_PROJECT_ID" --database-name marginsheet --role-name neondb_owner)
          echo "::add-mask::$CS"
          echo "NEON_DATABASE_URL=$CS" >> "$GITHUB_ENV"
          echo "EXPECTED_NEON_HOST=$(node -e "console.log(new URL(process.argv[1]).hostname)" "$CS")" >> "$GITHUB_ENV"
          PROD_CS=$(pnpm exec neonctl connection-string main --project-id "$NEON_PROJECT_ID" --database-name marginsheet --role-name neondb_owner)
          echo "::add-mask::$PROD_CS"
          echo "PRODUCTION_NEON_HOST=$(node -e "console.log(new URL(process.argv[1]).hostname)" "$PROD_CS")" >> "$GITHUB_ENV"
      - name: Isolation suite
        env:
          ISOLATION_TARGET: ${{ matrix.target }}
          PLAID_CLIENT_ID: ${{ matrix.target == 'dev' && secrets.DEV_PLAID_CLIENT_ID || secrets.STAGING_PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ matrix.target == 'dev' && secrets.DEV_PLAID_SECRET || secrets.STAGING_PLAID_SECRET }}
          STRIPE_SECRET: ${{ matrix.target == 'dev' && secrets.DEV_STRIPE_SECRET || secrets.STAGING_STRIPE_SECRET }}
        run: pnpm --filter @marginsheet/api test:isolation

  # Asks the six deployed Workers what database role they actually authenticate
  # as. Unlike the isolation suite, which derives its own connection string
  # from neonctl and therefore validates a credential no Worker uses, this
  # reads the deployed reality.
  #
  # It needs no secrets: /debug/db-identity is public and returns a role name
  # and a boolean. It runs on pull requests and on pushes to main, and it
  # checks the environments as they stand right now, so a PR can fail this job
  # for a break it did not cause. That is intended. An environment connecting
  # as the wrong role is not a thing to merge past.
  db-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every Worker connects as marginsheet_app, and holds no BYPASSRLS
        run: pnpm --filter @marginsheet/api test:db-identity

  # Migrations are append-only after merge (CLAUDE.md, ruled 16 Aug 2026).
  #
  # An environment that has applied a migration will never apply it again, so
  # editing a merged one reaches only the databases that have not seen it yet.
  # The result is two databases with identical ledgers and different schemas,
  # and nothing reports it until something reads the column. A convention
  # cannot catch that; this job can.
  #
  # Needs full history, hence fetch-depth 0: the check compares every merged
  # migration byte for byte against origin/main.
  # Open items print here, and the job fails when one has no owner. CLAUDE.md
  # has required this since M0 and nothing implemented it, so on 16 Aug 2026 an
  # item needed recording "like the others" and there were no others. A
  # practice that is documented and unenforced is the shape this build keeps
  # finding: the reviewer that did not exist, the comment warning against
  # rotating a long-lived branch, the verify step that could not run.
  # The per-source half of the magic-link send limits lives at the Cloudflare
  # edge, so the client IP never reaches our code and MarginSheet takes no
  # custody of network identity. That is correct and it creates drift: a
  # control living only in a dashboard is invisible to review. This reads the
  # live ruleset and fails if a rule declared in the repo is absent or altered.
  #
  # It keeps "cannot read" distinct from "absent". A checker that cannot see
  # the thing it guards must report neither answer.
  edge-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # Installs even though the script needs only node: setup-node's cache
      # post-step fails the job when the pnpm store path does not exist, and
      # a job that goes red in cleanup reads as the check having failed.
      - run: pnpm install --frozen-lockfile
      - name: The edge rate limiting rules match the repo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/scripts/verify-edge-rules.mjs

  # The register and the boundary run on every PR. The planted failures do not,
  # except when this PR touches a test the register names: that is the case
  # where waiting for the nightly costs something, because the author of a
  # desensitising change is the person who still has the context.
  control-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Every registered control names a test that exists
        run: pnpm --filter @marginsheet/api exec vitest run test/control-register.test.ts

      - name: What M3 covers, and what it does not
        run: node .github/scripts/boundary-report.mjs

      - name: Does this PR touch a test the register names?
        if: github.event_name == 'pull_request'
        id: touched
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only FETCH_HEAD...HEAD)
          REGISTERED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/control-register.json','utf8')).controls.map(c=>c.test).join('\n'))")
          HITS=$(comm -12 <(echo "$CHANGED" | sort -u) <(echo "$REGISTERED" | sort -u) || true)
          if [ -n "$HITS" ]; then
            echo "This PR touches registered control tests:"
            echo "$HITS"
            echo "hits<<EOF" >> "$GITHUB_OUTPUT"
            echo "$HITS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "No registered control tests touched; the nightly run covers these."
          fi

      - name: Create a scratch Neon branch
        if: steps.touched.outputs.hits != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          CS=$(scripts/neon-pr-branch.sh create 98${{ github.run_number }})
          echo "::add-mask::$CS"
          echo "PLANTED_DATABASE_URL=$CS" >> "$GITHUB_ENV"

      - name: Migrate it
        if: steps.touched.outputs.hits != ''
        env:
          DATABASE_URL: ${{ env.PLANTED_DATABASE_URL }}
        run: pnpm --filter @marginsheet/schema migrate:up

      - name: This PR changed a control test, so prove it still goes red
        if: steps.touched.outputs.hits != ''
        env:
          DATABASE_URL: ${{ env.PLANTED_DATABASE_URL }}
          NEON_TEST_BRANCH: pr-98${{ github.run_number }}
          CI: "1"
        run: node .github/scripts/planted-failures.mjs

      - name: Destroy the scratch branch
        if: always() && steps.touched.outputs.hits != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: scripts/neon-pr-branch.sh delete 98${{ github.run_number }} || true

  open-items:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm before setup-node, matching every other job here: setup-node
      # resolves the packageManager field and fails without it, even though
      # this script needs nothing but node.
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # Installs even though the script needs only node: setup-node's cache
      # post-step fails the job when the pnpm store path does not exist, and
      # a job that goes red in cleanup reads as the check having failed.
      - run: pnpm install --frozen-lockfile
      - name: Every open item names an owner and what it is owed to
        run: node .github/scripts/open-items.mjs

  migrations-append-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merged migrations are frozen; corrections go forward
        run: .github/scripts/check-migrations-append-only.sh
