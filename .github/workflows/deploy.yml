# Deploy through CI (M0 plan Task 0.7, extended 15 Aug 2026). This ends manual
# deploys, and with them the drift they cause: a hand-deployed environment
# silently sat on a stale build for hours on 15 Aug 2026.
#
# Staging deploys on every push to main. Production is SUPPOSED to wait on the
# `production` GitHub Environment, whose required reviewer is Guy: CI executes,
# a human still decides.
#
# !!! OPEN ITEM, 15 Aug 2026: THAT GATE DOES NOT EXIST. The `production`
# environment is configured with `protection_rules: []`, so this job has never
# paused for anyone. The first run of this workflow after the migrate step
# landed took production from queued to deployed in 37 seconds with no
# approval, and every production deploy since Task 0.7 went out the same way.
# The `environment: production` line below is real and the environment exists;
# it simply carries no rules. Fixing it is a repo settings change on Guy's
# desk: Settings, Environments, production, Required reviewers.
# Until it is set, `environment: production` documents an intention rather than
# enforcing a control, which is the exact shape of the 15 Aug incident. Every deploy is followed by a verification step that fails
# the job unless the live /health response reports the commit that was
# deployed. A deploy that did not propagate is a failure, not a pass.
#
# EXTENDED 15 Aug 2026, after a systems failure. This workflow deployed code to
# three environments for ten merged PRs while not one of their Neon branches
# held a single table. Nothing lied; nothing was asked. The pipeline had no
# migration step at any stage, and /health proved only that a Worker had
# booted, so "green deploy" never implied "migrated database" and no one
# noticed the difference.
#
# Every environment now MIGRATES BEFORE IT DEPLOYS, and a failed migration
# fails the deploy. Verification then asserts the live /health reports
# database.ok and a migration count matching the migration files in this
# commit. Code deployed against a schema it does not match is worse than a
# failed deploy, because it runs.
#
# ORDERING NOTE: migrations run before the new code, so the previous code
# briefly serves against the new schema. That is the safe direction for
# additive migrations and it is why every migration ships expand-first. A
# migration that breaks the currently-deployed code must be split across two
# deploys, never squeezed into one.
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: fancy-paper-35797264

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - name: Unit tests, golden suite, and the vocabulary lint layer
        run: pnpm --filter @marginsheet/api --filter @marginsheet/conversation --filter @marginsheet/lint --filter @marginsheet/shared --filter @marginsheet/fact-packages test

  # Dev tracks main. No approval gate: it is the always-latest environment,
  # and leaving it out of the pipeline is what let it drift a commit behind
  # within minutes of this workflow going live (15 Aug 2026).
  dev:
    needs: gates
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Count the migrations this commit carries
        run: echo "WANT_MIGRATIONS=$(ls packages/schema/migrations/*.sql | grep -v '\.down\.sql$' | wc -l | tr -d ' ')" >> "$GITHUB_ENV"

      - name: Derive the dev branch connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          CS=$(pnpm exec neonctl connection-string dev --project-id "$NEON_PROJECT_ID" --database-name marginsheet --role-name neondb_owner)
          echo "::add-mask::$CS"
          echo "ENV_DATABASE_URL=$CS" >> "$GITHUB_ENV"

      # Before the code, and failing the deploy if it fails.
      - name: Migrate dev
        env:
          DATABASE_URL: ${{ env.ENV_DATABASE_URL }}
        run: pnpm --filter @marginsheet/schema migrate:up

      - name: Deploy api to dev
        working-directory: services/api
        run: pnpm exec wrangler deploy --var BUILD_SHA:"${SHA:0:7}"

      - name: Deploy conversation to dev
        working-directory: services/conversation
        run: pnpm exec wrangler deploy --var BUILD_SHA:"${SHA:0:7}"

      - name: Verify dev serves this commit against this schema
        run: .github/scripts/verify-deploy.sh dev "${SHA:0:7}" "$WANT_MIGRATIONS"

  staging:
    needs: dev
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Count the migrations this commit carries
        run: echo "WANT_MIGRATIONS=$(ls packages/schema/migrations/*.sql | grep -v '\.down\.sql$' | wc -l | tr -d ' ')" >> "$GITHUB_ENV"

      - name: Derive the staging branch connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          CS=$(pnpm exec neonctl connection-string staging --project-id "$NEON_PROJECT_ID" --database-name marginsheet --role-name neondb_owner)
          echo "::add-mask::$CS"
          echo "ENV_DATABASE_URL=$CS" >> "$GITHUB_ENV"

      - name: Migrate staging
        env:
          DATABASE_URL: ${{ env.ENV_DATABASE_URL }}
        run: pnpm --filter @marginsheet/schema migrate:up

      - name: Deploy api to staging
        working-directory: services/api
        run: pnpm exec wrangler deploy --env staging --var BUILD_SHA:"${SHA:0:7}"

      - name: Deploy conversation to staging
        working-directory: services/conversation
        run: pnpm exec wrangler deploy --env staging --var BUILD_SHA:"${SHA:0:7}"

      - name: Deploy Pages
        working-directory: services/api
        run: |
          pnpm exec wrangler pages deploy "$GITHUB_WORKSPACE/apps/web/public" \
            --project-name marginsheet-web --branch main --commit-dirty=true

      - name: Verify staging serves this commit against this schema
        run: .github/scripts/verify-deploy.sh staging "${SHA:0:7}" "$WANT_MIGRATIONS"

  production:
    needs: staging
    runs-on: ubuntu-latest
    # Required reviewer gate. The job pauses here until a human approves in
    # the Actions UI, and the approval is recorded against the commit. The
    # production migration runs AFTER that approval, never before it.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Count the migrations this commit carries
        run: echo "WANT_MIGRATIONS=$(ls packages/schema/migrations/*.sql | grep -v '\.down\.sql$' | wc -l | tr -d ' ')" >> "$GITHUB_ENV"

      # Production is the `main` Neon branch. The environment names and the
      # branch names deliberately do not match, so this is spelled out rather
      # than derived.
      - name: Derive the production branch connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          CS=$(pnpm exec neonctl connection-string main --project-id "$NEON_PROJECT_ID" --database-name marginsheet --role-name neondb_owner)
          echo "::add-mask::$CS"
          echo "ENV_DATABASE_URL=$CS" >> "$GITHUB_ENV"

      - name: Migrate production
        env:
          DATABASE_URL: ${{ env.ENV_DATABASE_URL }}
        run: pnpm --filter @marginsheet/schema migrate:up

      - name: Deploy api to production
        working-directory: services/api
        run: pnpm exec wrangler deploy --env production --var BUILD_SHA:"${SHA:0:7}"

      - name: Deploy conversation to production
        working-directory: services/conversation
        run: pnpm exec wrangler deploy --env production --var BUILD_SHA:"${SHA:0:7}"

      - name: Verify production serves this commit against this schema
        run: .github/scripts/verify-deploy.sh production "${SHA:0:7}" "$WANT_MIGRATIONS"
