# Deploy through CI (M0 plan Task 0.7, extended 15 Aug 2026). This ends manual
# deploys, and with them the drift they cause: a hand-deployed environment
# silently sat on a stale build for hours on 15 Aug 2026.
#
# Staging deploys on every push to main. Production waits on the `production`
# GitHub Environment, whose required reviewer is Guy: CI executes, a human
# still decides.
#
# CLOSED 16 Aug 2026: that gate now exists. It was raised as an open item on
# 15 Aug, when the environment carried `protection_rules: []` and had never
# paused for anyone, and Guy attached the required reviewer the same day. Two
# runs on 16 Aug held for approval and were released by hand, which is the
# observation that closes it rather than the setting being reported back.
#
# Every deploy is followed by a verification step that fails the job unless the
# live /health response reports the commit that was deployed. A deploy that did
# not propagate is a failure, not a pass.
#
# EXTENDED 15 Aug 2026, after a systems failure. This workflow deployed code to
# three environments for ten merged PRs while not one of their Neon branches
# held a single table. Nothing lied; nothing was asked. The pipeline had no
# migration step at any stage, and /health proved only that a Worker had
# booted, so "green deploy" never implied "migrated database" and no one
# noticed the difference.
#
# Every environment now MIGRATES BEFORE IT DEPLOYS, and a failed migration
# fails the deploy. Verification then asserts the live /health reports
# database.ok and a migration count matching the migration files in this
# commit. Code deployed against a schema it does not match is worse than a
# failed deploy, because it runs.
#
# WHAT GREEN MEANS, rewritten 16 Aug 2026 after the sixth control of this
# family failed the "would this go red?" test.
#
# Green used to mean "no step errored". It now means "both Workers serve
# main's tip against a matching schema, and something looked."
#
# Two changes carry that. First, every verification step is `if: always()`
# instead of GitHub's default `if: success()`. A verify step guarded by
# success() reports on the case where nothing is wrong and is ABSENT in the
# case it exists to catch, which is the purest example of this failure shape
# yet: not a control pointed at the wrong thing, a control that structurally
# cannot observe its own failure case. On 16 Aug 2026 `wrangler deploy`
# uploaded the api Worker and then failed reconciling the zone route, so the
# step went red AFTER shipping code. The next step deployed conversation and
# was skipped by success(); the verification step was skipped by success()
# too. Production sat half-applied, twice, and the job's red pointed at the
# route call while the serving state was never measured.
#
# A red deploy step does not mean nothing shipped. Verification has to run
# precisely when a step failed, or it is documentation.
#
# Second, production refuses to deploy a commit main has moved past. See the
# step of that name below.
#
# ORDERING NOTE: migrations run before the new code, so the previous code
# briefly serves against the new schema. That is the safe direction for
# additive migrations and it is why every migration ships expand-first. A
# migration that breaks the currently-deployed code must be split across two
# deploys, never squeezed into one.
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: fancy-paper-35797264

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - name: Unit tests, golden suite, and the vocabulary lint layer
        run: pnpm --filter @marginsheet/api --filter @marginsheet/conversation --filter @marginsheet/lint --filter @marginsheet/shared --filter @marginsheet/fact-packages test

  # Dev tracks main. No approval gate: it is the always-latest environment,
  # and leaving it out of the pipeline is what let it drift a commit behind
  # within minutes of this workflow going live (15 Aug 2026).
  dev:
    needs: gates
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Count the migrations this commit carries
        run: echo "WANT_MIGRATIONS=$(ls packages/schema/migrations/*.sql | grep -v '\.down\.sql$' | wc -l | tr -d ' ')" >> "$GITHUB_ENV"

      - name: Derive the dev branch connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          CS=$(pnpm exec neonctl connection-string dev --project-id "$NEON_PROJECT_ID" --database-name marginsheet --role-name neondb_owner)
          echo "::add-mask::$CS"
          echo "ENV_DATABASE_URL=$CS" >> "$GITHUB_ENV"

      # Before the code, and failing the deploy if it fails.
      - name: Migrate dev
        id: migrate
        env:
          DATABASE_URL: ${{ env.ENV_DATABASE_URL }}
        run: pnpm --filter @marginsheet/schema migrate:up

      - name: Deploy api to dev
        working-directory: services/api
        run: pnpm exec wrangler deploy --var BUILD_SHA:"${SHA:0:7}"

      # Gated on the migration, not on the api deploy. See the production
      # job for the reasoning: a failed api deploy skipping this step is
      # what created a half-applied environment on 16 Aug 2026.
      - name: Deploy conversation to dev
        if: always() && steps.migrate.outcome == 'success'
        working-directory: services/conversation
        run: pnpm exec wrangler deploy --var BUILD_SHA:"${SHA:0:7}"

      # The sync Worker holds TOKEN_ENCRYPTION_KEY and has no public routes
      # (M4 section 2a). Gated on the migration like the others, because all
      # three run against one schema.
      - name: Deploy sync to dev
        if: always() && steps.migrate.outcome == 'success'
        working-directory: services/sync
        run: pnpm exec wrangler deploy --var BUILD_SHA:"${SHA:0:7}"

      # always(), not success(). See the WHAT GREEN MEANS note at the top.
      - name: Verify dev serves this commit against this schema
        if: always()
        run: .github/scripts/verify-deploy.sh dev "${SHA:0:7}" "$WANT_MIGRATIONS"

  staging:
    needs: dev
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Count the migrations this commit carries
        run: echo "WANT_MIGRATIONS=$(ls packages/schema/migrations/*.sql | grep -v '\.down\.sql$' | wc -l | tr -d ' ')" >> "$GITHUB_ENV"

      - name: Derive the staging branch connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          CS=$(pnpm exec neonctl connection-string staging --project-id "$NEON_PROJECT_ID" --database-name marginsheet --role-name neondb_owner)
          echo "::add-mask::$CS"
          echo "ENV_DATABASE_URL=$CS" >> "$GITHUB_ENV"

      - name: Migrate staging
        id: migrate
        env:
          DATABASE_URL: ${{ env.ENV_DATABASE_URL }}
        run: pnpm --filter @marginsheet/schema migrate:up

      - name: Deploy api to staging
        working-directory: services/api
        run: pnpm exec wrangler deploy --env staging --var BUILD_SHA:"${SHA:0:7}"

      # Gated on the migration, not on the api deploy. See the production
      # job for the reasoning: a failed api deploy skipping this step is
      # what created a half-applied environment on 16 Aug 2026.
      - name: Deploy conversation to staging
        if: always() && steps.migrate.outcome == 'success'
        working-directory: services/conversation
        run: pnpm exec wrangler deploy --env staging --var BUILD_SHA:"${SHA:0:7}"

      # The sync Worker holds TOKEN_ENCRYPTION_KEY and has no public routes
      # (M4 section 2a). Gated on the migration like the others, because all
      # three run against one schema.
      - name: Deploy sync to staging
        if: always() && steps.migrate.outcome == 'success'
        working-directory: services/sync
        run: pnpm exec wrangler deploy --env staging --var BUILD_SHA:"${SHA:0:7}"

      - name: Deploy Pages
        working-directory: services/api
        run: |
          pnpm exec wrangler pages deploy "$GITHUB_WORKSPACE/apps/web/public" \
            --project-name marginsheet-web --branch main --commit-dirty=true

      # always(), not success(). See the WHAT GREEN MEANS note at the top.
      - name: Verify staging serves this commit against this schema
        if: always()
        run: .github/scripts/verify-deploy.sh staging "${SHA:0:7}" "$WANT_MIGRATIONS"

  production:
    needs: staging
    runs-on: ubuntu-latest
    # Required reviewer gate. The job pauses here until a human approves in
    # the Actions UI, and the approval is recorded against the commit. The
    # production migration runs AFTER that approval, never before it.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      # Refuse to deploy a commit that main has already moved past.
      #
      # Every step in this job runs AFTER the required-reviewer approval, and
      # an approval arrives whenever a human gets to it. On 16 Aug 2026 two
      # runs were in flight: ea975f9 (main's tip) deployed api at 18:36:22,
      # then e92c825 (its parent, held for approval and approved later)
      # deployed api at 18:38:39. Production went backwards one commit and
      # nothing said so, because no check compared what was deployed against
      # what main held. "Green" meant "no step errored", never "current".
      #
      # This runs first so a stale run costs one step instead of a migration.
      # If it fails, approve the newest run rather than re-running this one.
      # Dev and staging carry no equivalent: they have no approval gate, so
      # they cannot be delayed past a newer commit by a human.
      - name: Refuse to deploy a commit main has moved past
        id: tip
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          TIP=$(git rev-parse FETCH_HEAD)
          if [ "$TIP" != "$SHA" ]; then
            echo "::error::Refusing to deploy ${SHA:0:7} to production: main is now ${TIP:0:7}."
            echo "Deploying this commit would roll production back. Approve the run for ${TIP:0:7} instead."
            exit 1
          fi
          echo "main's tip is ${TIP:0:7}, which is this commit."

      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Count the migrations this commit carries
        run: echo "WANT_MIGRATIONS=$(ls packages/schema/migrations/*.sql | grep -v '\.down\.sql$' | wc -l | tr -d ' ')" >> "$GITHUB_ENV"

      # Production is the `main` Neon branch. The environment names and the
      # branch names deliberately do not match, so this is spelled out rather
      # than derived.
      - name: Derive the production branch connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          CS=$(pnpm exec neonctl connection-string main --project-id "$NEON_PROJECT_ID" --database-name marginsheet --role-name neondb_owner)
          echo "::add-mask::$CS"
          echo "ENV_DATABASE_URL=$CS" >> "$GITHUB_ENV"

      - name: Migrate production
        id: migrate
        env:
          DATABASE_URL: ${{ env.ENV_DATABASE_URL }}
        run: pnpm --filter @marginsheet/schema migrate:up

      - name: Deploy api to production
        working-directory: services/api
        run: pnpm exec wrangler deploy --env production --var BUILD_SHA:"${SHA:0:7}"

      # Gated on the MIGRATION, not on the api deploy. Both Workers run against
      # the same schema, so a failed migration must stop both. A failed api
      # deploy must not stop this one: on 16 Aug 2026 api uploaded and then
      # failed reconciling its route, and success() skipped this step, so the
      # skip is what created the half-applied production rather than protecting
      # it. Two independent Workers, two independent outcomes, one verification
      # that reports whatever actually happened.
      - name: Deploy conversation to production
        if: always() && steps.migrate.outcome == 'success'
        working-directory: services/conversation
        run: pnpm exec wrangler deploy --env production --var BUILD_SHA:"${SHA:0:7}"

      # The sync Worker holds TOKEN_ENCRYPTION_KEY and has no public routes
      # (M4 section 2a). Gated on the migration like the others, because all
      # three run against one schema.
      - name: Deploy sync to production
        if: always() && steps.migrate.outcome == 'success'
        working-directory: services/sync
        run: pnpm exec wrangler deploy --env production --var BUILD_SHA:"${SHA:0:7}"

      # always(), not success(). See the WHAT GREEN MEANS note at the top. This
      # is the step whose absence on 16 Aug 2026 let a half-applied production
      # deploy go unobserved twice in four minutes.
      #
      # The one exception is a run the tip check refused. Nothing was deployed,
      # by design, and production is correctly serving a commit that is not
      # this one. Verifying there would report a mismatch we deliberately
      # created, which trains people to ignore the step. Every other failure
      # path, including a deploy that shipped half of production, still runs it.
      - name: Verify production serves this commit against this schema
        if: always() && steps.tip.outcome == 'success'
        run: .github/scripts/verify-deploy.sh production "${SHA:0:7}" "$WANT_MIGRATIONS"
